[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chirp-recorder"
version = "0.1.0"
description = "Times CODAR FMCW chirps on radiod IQ and writes sigmondb arrival rows"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Michael Hauan", email = "mjh@hauan.org"},
]
dependencies = [
    "numpy>=1.24",
    # >=3.14 adds RadiodControl(client_id=); the multicast destination comes
    # from (client, radiod), never from this client.  >=3.29 gives each
    # SpectrumStream a lifetime, so a crashed scout leaves no channel behind.
    "ka9q-python>=3.29.0",
    # >=0.11 adds chirp.streaks and chirp.scout_screen (the scout).
    "hamsci-dsp>=0.11.0",
    # Sink writer (hs_uploader.sink.Writer).  The writer falls back to
    # sigmond.hamsci_sink when this does not import.
    "hs-uploader>=0.1.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # The parity test runs codar-sounder's own pipeline on the same CPI.
    # Retires with the physics stopgap.
    "codar-sounder",
]

[project.scripts]
chirp-recorder = "chirp_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# Editable path siblings, as codar-sounder has them: a git pull of a sibling
# reaches this venv without a reinstall.
ka9q-python = { path = "../ka9q-python", editable = true }
hamsci-dsp = { path = "../hamsci-dsp", editable = true }
hs-uploader = { path = "../hs-uploader", editable = true }
codar-sounder = { path = "../codar-sounder", editable = true }
